<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Text to Voice</title>
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet" />
<style>
  body {
    background-color: #001f4d; /* dark blue */
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
    max-width: 700px;
    margin: 24px auto;
  }
  h1 { margin-bottom: 10px; }
  label { display:block; margin:10px 0 6px 0; font-weight:600; }
  select, textarea, button {
    font-size: 1rem;
  }
  #controls { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-bottom:10px; }
  select {
    padding:8px 10px; border-radius:6px; border:none; min-width:220px;
    background-color:#004080; color:white; cursor:pointer;
  }
  select:hover { background-color:#0059b3; }
  textarea {
    width:100%; height:130px; padding:10px; border-radius:6px; border:none; resize:vertical;
    background-color:#002a66; color:white;
  }
  button {
    background-color:#0059b3; color:white; border:none; padding:12px 18px;
    cursor:pointer; font-size:1rem; border-radius:6px; margin-top:10px;
  }
  button:hover { background-color:#004080; }
  #note { font-size:0.9rem; color:#cfe6ff; margin-top:8px; }
  audio { width:100%; margin-top:12px; display:none; }
</style>
</head>
<body>
  <h1>AI Text to Speech</h1>

  <div id="controls">
    <div style="flex:1 1 260px;">
      <label for="lang">Select Language</label>
      <select id="lang" aria-label="language"></select>
    </div>

    <div style="flex:1 1 260px;">
      <label for="voice">Select Voice (browser voices)</label>
      <select id="voice" aria-label="voice"></select>
    </div>
  </div>

  <label for="text">Enter Text</label>
  <textarea id="text" placeholder="Type text to speak..."></textarea>

  <button id="speakBtn">Speak</button>
  <button id="downloadBtn" style="display:none;">Download Audio</button>

  <div id="note">
    Note: For Indian languages choose any available voice (even English) to adjust accent — useful for multiple voice selection.  
    
  </div>

  <audio id="audioPlayer" controls></audio>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  // Elements
  const langSelect = document.getElementById('lang');
  const voiceSelect = document.getElementById('voice');
  const textInput = document.getElementById('text');
  const speakBtn = document.getElementById('speakBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const audioPlayer = document.getElementById('audioPlayer');

  const languages = [
    { code: 'en', name: 'English' },
    { code: 'gu', name: 'Gujarati (ગુજરાતી)' },
    { code: 'hi', name: 'Hindi (हिन्दी)' },
    { code: 'mr', name: 'Marathi (मराठी)' },
    { code: 'te', name: 'Telugu (తెలుగు)' },
    { code: 'ta', name: 'Tamil (தமிழ்)' },
    { code: 'kn', name: 'Kannada (ಕನ್ನಡ)' },
    { code: 'bn', name: 'Bengali (বাংলা)' },
    { code: 'pa', name: 'Punjabi (ਪੰਜਾਬੀ)' },
    { code: 'ml', name: 'Malayalam (മലയാളം)' },
    { code: 'ar', name: 'Arabic (العربية)' },
    { code: 'es', name: 'Spanish (Español)' },
    { code: 'fr', name: 'French (Français)' },
    { code: 'de', name: 'German (Deutsch)' },
    { code: 'zh-CN', name: 'Chinese (中文)' },
    { code: 'ja', name: 'Japanese (日本語)' },
    { code: 'ko', name: 'Korean (한국어)' },
    { code: 'ru', name: 'Russian (Русский)' },
    { code: 'pt', name: 'Portuguese (Português)' }
  ];

  const indianLangCodes = new Set(['gu','hi','mr','te','ta','kn','bn','pa','ml']);
  let voices = [];

  function populateLangDropdown() {
    langSelect.innerHTML = '';
    languages.forEach(({code,name}) => {
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = name;
      langSelect.appendChild(opt);
    });
    langSelect.value = 'en';
  }

  function populateVoiceDropdownFor(langCode) {
    voiceSelect.innerHTML = '';
    const normalizedLang = langCode.toLowerCase();
    const matches = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(normalizedLang));
    const list = matches.length ? matches : voices;
    if (list.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = 'No browser voices available';
      opt.disabled = true;
      voiceSelect.appendChild(opt);
      return;
    }
    list.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = `${v.name} — ${v.lang}${v.default ? ' [default]' : ''}`;
      voiceSelect.appendChild(opt);
    });
    voiceSelect.selectedIndex = 0;
  }

  function loadBrowserVoices() {
    voices = speechSynthesis.getVoices() || [];
    populateVoiceDropdownFor(langSelect.value);
  }

  function speakInBrowser(text, voiceName) {
    if (!('speechSynthesis' in window)) {
      Swal.fire({ icon:'error', title:'Not supported', text:'Your browser does not support Web Speech API.' });
      return;
    }
    const utter = new SpeechSynthesisUtterance(text);
    if (voiceName) {
      const v = voices.find(x => x.name === voiceName);
      if (v) utter.voice = v;
    }
    if (utter.voice && utter.voice.lang) utter.lang = utter.voice.lang;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }

  async function speakViaBackend(text, lang) {
    try {
      Swal.fire({ title: 'Synthesizing speech...', allowOutsideClick:false, didOpen: ()=> Swal.showLoading() });
      const res = await fetch('/tts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text, lang })
      });
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      audioPlayer.src = url;
      audioPlayer.style.display = 'block';
      await audioPlayer.play();
      Swal.close();

      // Enable download
      downloadBtn.style.display = 'inline-block';
      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'tts_audio.mp3';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      audioPlayer.onended = () => {
        URL.revokeObjectURL(url);
      };
    } catch (err) {
      Swal.fire({ icon:'error', title:'Error', text: err.message || err });
    }
  }

  async function handleSpeak() {
    const text = textInput.value.trim();
    const lang = langSelect.value;
    const selectedVoiceName = voiceSelect.value;
    if (!text) {
      Swal.fire({ icon:'warning', title:'Oops...', text:'Please enter text!', timer:2000, showConfirmButton:false });
      return;
    }
    if (indianLangCodes.has(lang)) {
      const voiceToUse = voices.find(v => v.name === selectedVoiceName) || voices.find(v => v.lang.toLowerCase().startsWith(lang.toLowerCase()));
      if (!voiceToUse) {
        Swal.fire({ icon:'error', title:'No browser voices', text:'No voices available.' });
        return;
      }
      speakInBrowser(text, voiceToUse.name);
      downloadBtn.style.display = 'none'; // No download for in-browser voices
      return;
    }
    await speakViaBackend(text, lang);
  }

  langSelect.addEventListener('change', () => populateVoiceDropdownFor(langSelect.value));
  speakBtn.addEventListener('click', handleSpeak);

  populateLangDropdown();
  loadBrowserVoices();
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.onvoiceschanged = () => loadBrowserVoices();
  }
</script>
</body>
</html>
